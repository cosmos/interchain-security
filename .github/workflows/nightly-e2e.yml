# Run integration tests nightly on main
name: nightly-e2e-main
on:
  workflow_dispatch:
  schedule:
    # run every day at 03:00 UTC
    #        ┌───────────── minute (0 - 59)
    #        │  ┌───────────── hour (0 - 23)
    #        │  │ ┌───────────── day of the month (1 - 31)
    #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
    #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
    #        │  │ │ │ │
    #        │  │ │ │ │
    #        │  │ │ │ │
    #        *  * * * *
    - cron: "0 3 * * *"

jobs:
  compatibility-test:
    runs-on: ubuntu-latest
    # Each consumer version runs as an independent matrix job. A single scenario
    # normally completes in well under 30 minutes, so this timeout makes a hung
    # scenario (e.g. a consumer chain that never starts) fail fast instead of
    # blocking for hours.
    timeout-minutes: 30
    strategy:
      # Don't cancel sibling versions if one version is incompatible/hangs.
      fail-fast: false
      matrix:
        # Consumer versions tested against the latest provider.
        # For new versions to be tested add/remove entries here.
        consumer-version: [latest]
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # get all history for all branches and tags (needed to build tagged versions)
      - name: Checkout LFS objects
        run: git lfs checkout
      - name: E2E compatibility test
        # Run compatibility tests for the latest provider against a single consumer
        # version per matrix job.
        run: go run ./tests/e2e/... --tc compatibility -pv latest -cv ${{ matrix.consumer-version }}
  happy-path-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
      - uses: actions/checkout@v4
      - name: Checkout LFS objects
