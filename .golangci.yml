version: "2"

run:
  tests: true
  timeout: 10m
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - dogsled
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - staticcheck
    - revive
    - thelper
    - unconvert
    - unused
  settings:
    staticcheck:
      checks:
        - "-QF*"
        - "-SA1019"
    gosec:
      excludes:
        - G104
        - G204
    dogsled:
      max-blank-identifiers: 3
    gocritic:
      disabled-checks:
        - appendAssign
        - ifElseChain
    revive:
      rules:
        - name: var-naming
          disabled: true
    nolintlint:
      allow-unused: true
      allow-leading-space: true
      require-explanation: false
      require-specific: false
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      - text: 'Use of weak random number generator'
        linters:
          - gosec
      - text: 'G115:'
        linters:
          - gosec
      - text: 'ST1003:'
        linters:
          - staticcheck
      - text: 'ST1016:'
        linters:
          - staticcheck
      - text: 'leading space'
        linters:
          - nolintlint

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
        - prefix(cosmossdk.io)
        - prefix(github.com/cosmos/cosmos-sdk)
        - prefix(github.com/cometbft/cometbft)
        - prefix(github.com/cosmos/interchain-security)
      custom-order: true
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 10000
  max-same-issues: 10000
